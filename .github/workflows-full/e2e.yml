name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stack:
    name: full stack on Floci (option matrix, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The first start also downloads the local embedding model (about 130 MB).
      - name: Start the stack (Terraform applies local-floci inside compose)
        run: make up
      - name: Seed the Lumen demo company and wire the demo site widget
        run: make demo
      - name: Acceptance tests against the running stack
        run: make test-stack
      - name: Integration suite under every storage, key and Redis backend
        run: make test-matrix
      - name: Browser end-to-end tests (Chromium)
        run: make e2e
      - name: Browser QA sweep
        run: make qa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            scripts/qa/output
      - name: Logs on failure
        if: failure()
        run: make logs SERVICE= | tail -500
      - if: always()
        run: make down

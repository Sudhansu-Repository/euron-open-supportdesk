[project]
name = "supportdesk"
version = "0.1.0"
description = "Euron Open SupportDesk: a self-hosted support desk whose AI agent answers from your own knowledge, escalates the rest to humans with context, and shows what every answer cost."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
# One package for the API, the background worker and the CLI; both images install it.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "orjson>=3.10",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pyjwt>=2.10",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "cryptography>=43",
  "prometheus-client>=0.21",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "python-multipart>=0.0.20",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local embeddings (ONNX on CPU). The images install it; unit tests use the hash embedder.
local-embeddings = ["fastembed>=0.5"]

[project.scripts]
supportdesk = "supportdesk.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "boto3-stubs[s3,kms,secretsmanager,ses]>=1.35",
  "types-beautifulsoup4>=4.12",
  "asgi-lifespan>=2.1",
  "types-pyyaml>=6.0",
  "websockets>=17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportdesk", "src/mockai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101", "B008", "RUF012", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "E501", "PT018", "PT022", "PT011", "S110"]
"src/supportdesk/migrations/**" = ["E501", "UP", "I"]
"src/mockai/**" = ["E501", "S311"]
"src/supportdesk/demo/**" = ["E501", "S311"]
# Prompt text and SQL read better unwrapped.
"src/supportdesk/ai/prompts.py" = ["E501"]
"src/supportdesk/analytics/service.py" = ["E501"]
# Files whose long lines are SQL inside string literals (which cannot carry noqa comments).
"src/supportdesk/ai/budget.py" = ["E501"]
"src/supportdesk/auth/service.py" = ["E501"]
"src/supportdesk/knowledge/models.py" = ["E501"]
"src/supportdesk/knowledge/router.py" = ["E501"]
"src/supportdesk/tickets/queries.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asgi_lifespan.*", "fastembed.*", "pgvector.*", "docx.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: needs Postgres, Redis, Floci and the mock AI (make test-integration)",
  "stack: needs the running stack (make up, then make test-stack)",
  "ollama: needs a real Ollama with the demo model pulled (make test-ollama)",
]
addopts = "-ra"
# A test running longer than this gets every thread's stack dumped (it is not killed), so
# a hang shows where it waits instead of only that it waits.
faulthandler_timeout = 120

[tool.coverage.run]
source = ["supportdesk"]
branch = true
concurrency = ["greenlet", "thread"]
# The demo seed is exercised by make demo; the mock AI is test infrastructure.
omit = ["*/migrations/*", "*/demo/*", "*/mockai/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true

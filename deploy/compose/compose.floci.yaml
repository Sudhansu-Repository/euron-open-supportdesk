# ─────────────────────────────────────────────────────────────────────────────
# Overlay: emulated AWS with Floci (https://github.com/floci-io/floci, MIT).
#
# The SAME Terraform that provisions real AWS (infra/terraform/modules) runs here
# against the emulator: the `terraform` one-shot applies infra/terraform/envs/local-floci
# (objects bucket, KMS key and alias, Secrets Manager secrets, SES identity) before
# migrate, api and worker start. The api and the worker then use S3 and KMS exactly as
# they do on AWS:
#
#   sealed secrets  AI provider keys and webhook signing secrets, sealed with KMS Encrypt
#                   (alias/supportdesk-local), encryption context bound to their row
#   objects         S3 bucket supportdesk-local-objects, SSE-KMS: knowledge uploads,
#                   attachments, exports and backups
#
# The web app and the demo site call only the api, so they are unchanged. Outgoing mail
# stays in Mailpit (the SES identity exists on the emulator, but SMTP is what you can see).
# ─────────────────────────────────────────────────────────────────────────────
x-floci-env: &floci-env
  SUPPORTDESK_CLOUD: floci
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://floci:4566
  S3_FORCE_PATH_STYLE: "true"
  STORAGE: s3
  OBJECTS_BUCKET: supportdesk-local-objects
  KEY_MODE: kms
  KMS_KEY_ID: alias/supportdesk-local

services:
  floci:
    image: floci/floci:2.3.0
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /data
    ports:
      - "127.0.0.1:${SD_FLOCI_PORT:-4866}:4566"
    volumes:
      - flocidata:/data
      # Only Docker-backed emulated services (Lambda, ECS, RDS) need the Docker
      # socket. This stack uses S3, KMS, Secrets Manager and SES, so it stays unmounted.
    networks:
      default:
        # The S3 Control API (bucket tagging) addresses <account-id>.<endpoint>, so the
        # emulated account's name has to resolve to the emulator as well.
        aliases: ["000000000000.floci"]
    # The image ships no shell tools for a healthcheck; the terraform one-shot waits for
    # the endpoint instead.
    restart: unless-stopped

  # One-shot: provision the emulator with the production modules. Providers are cached
  # in the supportdesk-tf-plugins volume (shared with make tf-validate, and kept by
  # make down), so later runs start in seconds.
  terraform:
    image: hashicorp/terraform:1.16.6
    working_dir: /infra/terraform/envs/local-floci
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "waiting for floci..."
        until wget -q -O /dev/null http://floci:4566/; do sleep 1; done
        mkdir -p /tfdata/state
        terraform init -input=false -no-color >/dev/null
        # State lives in the tfdata volume, so it shares the emulator's lifecycle
        # (make down wipes both together).
        terraform apply -input=false -auto-approve -no-color -state=/tfdata/state/local.tfstate -var endpoint=http://floci:4566 -var cors_origins='["http://localhost:${SD_WEB_PORT:-4810}","http://127.0.0.1:${SD_WEB_PORT:-4810}"]'
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
      TF_DATA_DIR: /tfdata/work
      TF_PLUGIN_CACHE_DIR: /plugins
    volumes:
      - ../../infra/terraform:/infra/terraform
      - tfdata:/tfdata
      - tfplugins:/plugins
    depends_on:
      - floci
    restart: "no"

  migrate:
    environment:
      <<: *floci-env
    depends_on:
      terraform:
        condition: service_completed_successfully

  api:
    environment:
      <<: *floci-env
    depends_on:
      terraform:
        condition: service_completed_successfully

  worker:
    environment:
      <<: *floci-env
    depends_on:
      terraform:
        condition: service_completed_successfully

volumes:
  flocidata:
  tfdata:
  tfplugins:
    name: supportdesk-tf-plugins

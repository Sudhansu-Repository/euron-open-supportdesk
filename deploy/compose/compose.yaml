# ─────────────────────────────────────────────────────────────────────────────
# Euron Open SupportDesk: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 4810   demo site 4815   mailpit 4825 (SMTP 4826)   api 4830   ollama 4834
#   postgres 4842   mock AI 4850   floci 4866   redis 4879
#
# The optional local LLM: `make ollama-pull` starts the `ollama` profile and pulls the
# zero-API-key model; its models live in a volume that survives `make down`.
# ─────────────────────────────────────────────────────────────────────────────
name: supportdesk

x-server-build: &server-build
  context: ../../apps/api
  dockerfile: ../../infra/docker/server.Dockerfile
  target: api

x-api-env: &api-env
  # Development mode: the local stack talks to an emulator and links to localhost, both
  # of which the production guards refuse on purpose.
  ENVIRONMENT: development
  SUPPORTDESK_CLOUD: local
  LOG_LEVEL: ${SD_LOG_LEVEL:-INFO}
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://supportdesk:supportdesk@postgres:5432/supportdesk
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  TOKEN_PEPPER: ${TOKEN_PEPPER:?run `make env` first}
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?run `make env` first}
  KEY_MODE: local
  STORAGE: local
  LOCAL_STORAGE_DIR: /data/objects
  COOKIE_SECURE: "false"
  # The web container proxies /api with X-Forwarded-For; trust it on the Compose network.
  # On AWS this is the VPC CIDR.
  FORWARDED_ALLOW_IPS: "*"
  # The agent app. The widget's own origins are per inbox (allowed origins in Settings).
  CORS_ORIGINS: http://localhost:${SD_WEB_PORT:-4810},http://127.0.0.1:${SD_WEB_PORT:-4810}
  PUBLIC_URL: http://localhost:${SD_WEB_PORT:-4810}
  PUBLIC_API_URL: http://localhost:${SD_API_PORT:-4830}
  # Every email the app sends lands in Mailpit (http://localhost:4825).
  MAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM_ADDRESS: support@supportdesk.local
  MAIL_REPLY_DOMAIN: supportdesk.local
  # Local embeddings (fastembed, BAAI/bge-small-en-v1.5): downloaded once into the
  # shared models volume, which survives `make down`. The worker warms it at start.
  EMBEDDER: local
  MODEL_CACHE_DIR: /var/cache/supportdesk/models
  # The zero-API-key local model (`make ollama-pull`), offered as the Ollama default.
  OLLAMA_URL: http://ollama:11434
  # Local demo only: AI endpoints, webhooks and crawls may target this network
  # (Ollama, the mock AI, the demo site). Production refuses ALLOW_PRIVATE_URLS.
  AI_ALLOW_PRIVATE_ENDPOINTS: "true"
  ALLOW_PRIVATE_URLS: "true"
  # `make demo`: the seeded Lumen org answers with the bundled mock model (offline, no
  # key); switch it to extractive, Ollama or a real provider in Settings > AI.
  SEED_AI_URL: http://mockai:4850/v1
  SUPPORTDESK_DEMO_PASSWORD: ${SD_DEMO_PASSWORD:-Demo-Pass-2026}

x-server: &server
  image: supportdesk-server:local
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: supportdesk
      POSTGRES_PASSWORD: supportdesk
    ports:
      - "127.0.0.1:${SD_PG_PORT:-4842}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportdesk -d supportdesk"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Live fan-out across api replicas, the exact answer cache, budget counters and rate
  # limits. Jobs never live here, so volatile-lru may evict cache entries (they carry a
  # TTL) but never counters (they carry none), matching the ElastiCache parameter group.
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${SD_REDIS_PORT:-4879}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Catches every email the app sends (SMTP 1025, web UI on 4825, SMTP on 4826 for tests).
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${SD_MAILPIT_PORT:-4825}:8025"
      - "127.0.0.1:${SD_SMTP_PORT:-4826}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # A deterministic stand-in for LLM providers (OpenAI, Anthropic and Ollama wire formats):
  # the demo and the tests run with no key and no network.
  mockai:
    <<: *server
    build: *server-build
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["uvicorn", "mockai.app:app", "--host", "0.0.0.0", "--port", "4850", "--no-access-log"]
    ports:
      - "127.0.0.1:${SD_MOCK_AI_PORT:-4850}:4850"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4850/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Migrate first: the api and the worker start only once the schema (and the vector
  # extension) is in place.
  migrate:
    <<: *server
    command: ["migrate"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      mockai:
        condition: service_started
    restart: "no"

  api:
    <<: *server
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${SD_API_PORT:-4830}:8080"
    volumes:
      - objects:/data/objects
      - models:/var/cache/supportdesk/models
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Background jobs: AI turns, knowledge indexing, mail in and out, webhooks, SLA scans,
  # analytics rollups. Warms the embedding model at start (the first run downloads it).
  worker:
    <<: *server
    command: ["worker"]
    environment:
      <<: *api-env
    volumes:
      - objects:/data/objects
      - models:/var/cache/supportdesk/models
    # The worker serves no HTTP: it is healthy while its metrics endpoint answers. The
    # long start period covers the one-time model download.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9464/metrics', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 300s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # The agent app, customer portal, help center and widget.js. The browser talks to this
  # origin; Next rewrites /api to the api on the Compose network.
  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    image: supportdesk-web:local
    environment:
      API_URL: http://api:8080
      API_INTERNAL_URL: http://api:8080
      PORT: "8080"
    ports:
      - "127.0.0.1:${SD_WEB_PORT:-4810}:8080"
    read_only: true
    tmpfs:
      # The node user is uid 1000; Next writes its image cache under .next/cache.
      - /tmp:uid=1000,gid=1000
      - /app/.next/cache:uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # "Lumen", a fake customer website on another origin (http://localhost:4815) that
  # embeds the chat widget exactly as a real customer would. `make demo` writes the
  # widget key into deploy/demo-site/site/config.js (git-ignored).
  demo-site:
    image: nginxinc/nginx-unprivileged:1.29.1-alpine
    ports:
      - "127.0.0.1:${SD_DEMO_PORT:-4815}:8080"
    volumes:
      - ../demo-site/site:/usr/share/nginx/html:ro
      - ../demo-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Optional local LLM (make ollama-pull): the zero-API-key mode with a real model.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:${SD_OLLAMA_PORT:-4834}:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  objects:
  # Survive `make down` (it deletes only the data volumes): the embedding model and the
  # Ollama models are large downloads that never change.
  models:
    name: supportdesk-models
  ollama:
    name: supportdesk-ollama

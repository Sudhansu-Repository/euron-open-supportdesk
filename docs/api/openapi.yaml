components:
  schemas:
    AcceptInvitation:
      properties:
        token:
          type: string
          maxLength: 200
          minLength: 10
          title: Token
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        password:
          type: string
          maxLength: 256
          minLength: 10
          title: Password
      type: object
      required:
      - token
      - name
      - password
      title: AcceptInvitation
    Ack:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
        message:
          type: string
          title: Message
          default: ''
      type: object
      title: Ack
    AiConfig:
      properties:
        provider:
          type: string
          enum:
          - extractive
          - ollama
          - openai
          - anthropic
          title: Provider
          default: extractive
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
          description: Endpoint for ollama, openai (any compatible server) or anthropic
        answer_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Answer Model
        triage_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Triage Model
          description: A cheaper model for classification and summaries (model routing)
        llm_triage:
          type: boolean
          title: Llm Triage
          default: true
        embedder:
          type: string
          enum:
          - local
          - ollama
          - openai
          title: Embedder
          default: local
        embed_base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Embed Base Url
        embed_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Embed Model
        embed_dims:
          anyOf:
          - type: integer
            maximum: 4096.0
            minimum: 64.0
          - type: 'null'
          title: Embed Dims
        temperature:
          type: number
          maximum: 1.5
          minimum: 0.0
          title: Temperature
          default: 0.2
        max_answer_tokens:
          type: integer
          maximum: 4000.0
          minimum: 50.0
          title: Max Answer Tokens
          default: 400
        context_tokens:
          type: integer
          maximum: 16000.0
          minimum: 200.0
          title: Context Tokens
          default: 1800
        top_k:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Top K
          default: 5
      type: object
      title: AiConfig
      description: Which models answer, triage and embed. ``extractive`` needs no model at all.
    AiTestResult:
      properties:
        ok:
          type: boolean
          title: Ok
        provider:
          type: string
          title: Provider
        model:
          type: string
          title: Model
        latency_ms:
          type: integer
          title: Latency Ms
        message:
          type: string
          title: Message
        sample:
          anyOf:
          - type: string
          - type: 'null'
          title: Sample
      type: object
      required:
      - ok
      - provider
      - model
      - latency_ms
      - message
      title: AiTestResult
    ApiKeyCreated:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:

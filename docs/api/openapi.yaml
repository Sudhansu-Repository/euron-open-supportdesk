openapi: 3.1.0
info:
  title: Euron Open SupportDesk
  description: "\nAPI of a self-hosted support desk whose AI agent answers from your own knowledge, hands\n\
    the rest to people with context, and records what every answer cost.\n\n* Agents sign in with `POST\
    \ /api/v1/auth/login` and send the session token as\n  `Authorization: Bearer <token>` (the web app\
    \ uses an HttpOnly cookie instead).\n* Integrations use an API key from Settings > API keys: `Authorization:\
    \ Bearer sdk_...`.\n  Read keys list and read conversations, customers and articles; write keys also\
    \ open\n  conversations and reply.\n* The website widget, the customer portal, the help center and\
    \ inbound email are public\n  endpoints, authenticated by visitor tokens, portal tokens and inbound\
    \ tokens.\n* Live updates: WebSockets at `/ws/agent`, `/ws/widget/{ticket_id}` and\n  `/ws/portal/{ticket_id}`\
    \ carry small \"changed\" events; fetch the data over REST.\n* Webhooks are signed: `X-SupportDesk-Signature:\
    \ t=<unix>,v1=<hex HMAC-SHA256 of t.body>`.\n"
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Sign in as an agent
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
